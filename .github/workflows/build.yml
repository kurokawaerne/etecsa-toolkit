name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust core tests
        working-directory: core-rust
        run: cargo test
      - name: Rust core JNI build check
        working-directory: core-rust
        run: cargo build --release --features jni
  c-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test C core
        working-directory: core-c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/toolkit_c_test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Android debug APK (split per ABI + universal)
        run: ./gradlew :app:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: etecsa-toolkit-debug-apks
          path: app/build/outputs/apk/debug/*.apk
