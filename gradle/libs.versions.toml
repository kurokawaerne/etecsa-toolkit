[versions]
kotlin = "2.2.21"
compose = "1.10.0"
compose-material3 = "1.10.0-alpha05"
composables-icons = "2.2.1"
agp = "8.11.1"
kotlinx-serialization = "1.9.0"
kotlinx-coroutines = "1.10.2"
androidx-activity-compose = "1.11.0"
androidx-core-splashscreen = "1.2.0"
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
material-symbols-outlined = { module = "com.composables:icons-material-symbols-outlined-cmp", version.ref = "composables-icons" }
material-symbols-outlined-filled = { module = "com.composables:icons-material-symbols-outlined-filled-cmp", version.ref = "composables-icons" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
